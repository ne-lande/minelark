name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.value }} --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Minelark ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/minelark-${{ steps.version.outputs.value }}.jar
            build/libs/minelark-${{ steps.version.outputs.value }}-sources.jar
