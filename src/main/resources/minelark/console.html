<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minelark Console</title>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --fg: #d7dae0; --muted: #7d8794;
    --accent: #56b6c2; --result: #98c379; --error: #e06c75; --input: #61afef;
    --border: #333844;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  header {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .entry { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .entry .code { color: var(--input); }
  .entry .code::before { content: ">>> "; color: var(--muted); }
  .entry .out { color: var(--result); }
  .entry .err { color: var(--error); }
  .entry .note { color: var(--muted); }
  footer { border-top: 1px solid var(--border); padding: 10px 14px; background: var(--panel); }
  #input {
    width: 100%; resize: none; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px;
    font: inherit; min-height: 40px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  button {
    background: var(--accent); color: #10232a; border: 0; border-radius: 5px;
    padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Minelark Console</h1>
    <span class="hint">Ctrl/Cmd+Enter to run &middot; Enter for a newline &middot; Up/Down for history</span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="input" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="registry.item_exists(&quot;diamond&quot;)"></textarea>
    <div class="row">
      <button id="run">Run</button>
      <span class="status" id="status"></span>
    </div>
  </footer>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const runBtn = document.getElementById("run");
  const status = document.getElementById("status");
  const history = [];
  let historyIndex = 0;

  function el(cls, text) {
    const node = document.createElement("div");
    node.className = cls;
    node.textContent = text;
    return node;
  }

  function addEntry(code, lines, failed) {
    const entry = document.createElement("div");
    entry.className = "entry";
    entry.appendChild(el("code", code));
    if (lines.length === 0) {
      entry.appendChild(el("note", failed ? "(no response)" : "ok"));
    } else {
      for (const line of lines) {
        entry.appendChild(el(line.startsWith("error:") || line.startsWith("syntax error:") ? "err" : "out", line));
      }
    }
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  async function run() {
    const code = input.value;
    if (!code.trim()) return;
    runBtn.disabled = true;
    status.textContent = "running...";
    history.push(code);
    historyIndex = history.length;
    try {
      const res = await fetch("eval", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Minelark-Token": token },
        body: JSON.stringify({ code })
      });
      if (res.status === 401) {
        addEntry(code, ["error: unauthorized - open the URL the game logged (it carries the token)"], true);
      } else if (!res.ok) {
        addEntry(code, ["error: " + res.status + " " + (await res.text())], true);
      } else {
        const data = await res.json();
        addEntry(code, data.output || [], false);
      }
      input.value = "";
      sizeInput();
    } catch (e) {
      addEntry(code, ["error: could not reach the server (" + e + ")"], true);
    } finally {
      runBtn.disabled = false;
      status.textContent = "";
      input.focus();
    }
  }

  function sizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 240) + "px";
  }

  input.addEventListener("input", sizeInput);
  runBtn.addEventListener("click", run);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      run();
      return;
    }
    // History only when the field is a single line, so multi-line editing is unaffected.
    const singleLine = !input.value.includes("\n");
    if (e.key === "ArrowUp" && singleLine && historyIndex > 0) {
      e.preventDefault();
      historyIndex--;
      input.value = history[historyIndex];
      sizeInput();
    } else if (e.key === "ArrowDown" && singleLine && historyIndex < history.length) {
      e.preventDefault();
      historyIndex++;
      input.value = historyIndex === history.length ? "" : history[historyIndex];
      sizeInput();
    }
  });

  input.focus();
</script>
</body>
</html>
