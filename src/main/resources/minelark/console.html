<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minelark Console</title>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --fg: #d7dae0; --muted: #7d8794;
    --accent: #56b6c2; --result: #98c379; --error: #e06c75; --input: #61afef;
    --border: #333844;
    --kw: #c678dd; --builtin: #56b6c2; --ns: #61afef; --string: #98c379;
    --number: #d19a66; --comment: #6a7482;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  header {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button.link {
    background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer;
    text-decoration: underline; padding: 0;
  }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .entry { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  /* Hanging indent: ">>> " sits in the margin, and every following line of the snippet aligns
     under the code (4 monospace chars = the width of ">>> "). */
  .entry .code { padding-left: 4ch; text-indent: -4ch; }
  .entry .code::before { content: ">>> "; color: var(--muted); }
  .entry .out { color: var(--result); }
  .entry .err { color: var(--error); }
  .entry .note { color: var(--muted); }
  footer { border-top: 1px solid var(--border); padding: 10px 14px; background: var(--panel); }

  /* The editor: a transparent textarea over a highlighted mirror, sharing exact box metrics. */
  .editor { position: relative; }
  #input, #mirror {
    margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 5px;
    font: inherit; line-height: 1.5; letter-spacing: normal; tab-size: 4;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    min-height: 42px; max-height: 260px;
  }
  #mirror {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    color: var(--fg); background: var(--bg); border-color: transparent;
  }
  #input {
    position: relative; width: 100%; resize: none; background: transparent;
    color: transparent; caret-color: var(--fg); overflow-y: auto;
  }
  #input:focus { outline: none; }
  .editor:focus-within #mirror { border: 1px solid var(--accent); }
  .t-kw { color: var(--kw); } .t-builtin { color: var(--builtin); } .t-ns { color: var(--ns); }
  .t-string { color: var(--string); } .t-number { color: var(--number); } .t-comment { color: var(--comment); }

  #complete {
    position: absolute; bottom: 100%; left: 0; margin-bottom: 4px; display: none; z-index: 10;
    min-width: 240px; max-height: 200px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .45);
  }
  #complete.show { display: block; }
  #complete .opt { padding: 3px 10px; cursor: pointer; white-space: pre; color: var(--fg); }
  #complete .opt.sel { background: var(--accent); color: #10232a; }

  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  button.run {
    background: var(--accent); color: #10232a; border: 0; border-radius: 5px;
    padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.run:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Minelark Console</h1>
    <span class="hint">Enter run &middot; Shift+Enter newline &middot; Tab indent &middot; Up/Down history &middot; autocomplete as you type</span>
    <span class="spacer"></span>
    <button class="link" id="clear">clear</button>
  </header>
  <div id="log"></div>
  <footer>
    <div class="editor">
      <pre id="mirror" aria-hidden="true"></pre>
      <textarea id="input" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="registry.item_exists(&quot;diamond&quot;)"></textarea>
      <div id="complete"></div>
    </div>
    <div class="row">
      <button class="run" id="run">Run</button>
      <span class="status" id="status"></span>
    </div>
  </footer>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const mirror = document.getElementById("mirror");
  const runBtn = document.getElementById("run");
  const status = document.getElementById("status");
  const completeBox = document.getElementById("complete");

  // --- autocomplete symbols (reflected off the API annotations, served at /symbols) ---
  let SYM = { globals: [], members: {} };
  fetch("symbols").then(r => r.json()).then(s => { SYM = s; }).catch(() => { /* completion just off */ });
  let comp = { items: [], sel: 0, wordLen: 0 };

  // --- history (persisted per origin) ---
  const HKEY = "minelark.console.history";
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem(HKEY) || "[]");
    if (!Array.isArray(history)) history = [];
  } catch (e) {
    console.warn("Minelark console: could not read history", e);
    history = [];
  }
  let historyIndex = history.length;
  function pushHistory(code) {
    if (history[history.length - 1] !== code) history.push(code);
    while (history.length > 200) history.shift();
    historyIndex = history.length;
    try {
      localStorage.setItem(HKEY, JSON.stringify(history));
    } catch (e) {
      console.warn("Minelark console: could not save history (private mode?)", e);
    }
  }

  // --- syntax highlighting ---
  const KW = new Set(["def","return","if","elif","else","for","while","in","and","or","not","None",
    "True","False","break","continue","pass","lambda","load"]);
  const BUILTIN = new Set(["print","len","range","str","int","float","bool","list","dict","tuple",
    "type","enumerate","zip","reversed","sorted","min","max","sum","abs","repr","hasattr","getattr",
    "dir","fail","any","all"]);
  const NS = new Set(["log","storage","world","mods","registry","text","translate"]);
  const TOKEN = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|([^\w\s]+)/g;
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function span(cls, text) { return '<span class="' + cls + '">' + esc(text) + "</span>"; }
  function highlight(code) {
    return code.replace(TOKEN, (m, comment, str, num, ident) => {
      if (comment != null) return span("t-comment", comment);
      if (str != null) return span("t-string", str);
      if (num != null) return span("t-number", num);
      if (ident != null) {
        const cls = KW.has(ident) ? "t-kw" : BUILTIN.has(ident) ? "t-builtin" : NS.has(ident) ? "t-ns" : null;
        return cls ? span(cls, ident) : esc(ident);
      }
      return esc(m);
    });
  }
  function refresh() {
    mirror.innerHTML = highlight(input.value) + "\n";   // trailing NL keeps the last line sized
    input.style.height = "auto";
    const h = Math.min(input.scrollHeight, 260);
    input.style.height = h + "px";
    mirror.style.height = h + "px";
    mirror.scrollTop = input.scrollTop;
  }

  // --- output ---
  function el(cls, text) {
    const node = document.createElement("div");
    node.className = cls;
    node.textContent = text;
    return node;
  }
  function addEntry(code, lines, failed) {
    const entry = document.createElement("div");
    entry.className = "entry";
    const codeEl = document.createElement("div");
    codeEl.className = "code";
    codeEl.innerHTML = highlight(code);
    entry.appendChild(codeEl);
    if (lines.length === 0) {
      entry.appendChild(el("note", failed ? "(no response)" : "ok"));
    } else {
      for (const line of lines) {
        const bad = line.startsWith("error:") || line.startsWith("syntax error:");
        entry.appendChild(el(bad ? "err" : "out", line));
      }
    }
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  async function run() {
    const code = input.value;
    if (!code.trim()) return;
    runBtn.disabled = true;
    status.textContent = "running...";
    pushHistory(code);
    try {
      const res = await fetch("eval", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Minelark-Token": token },
        body: JSON.stringify({ code })
      });
      if (res.status === 401) {
        addEntry(code, ["error: unauthorized - open the URL the game logged (it carries the token)"], true);
      } else if (!res.ok) {
        addEntry(code, ["error: " + res.status + " " + (await res.text())], true);
      } else {
        const data = await res.json();
        addEntry(code, data.output || [], false);
      }
      input.value = "";
      refresh();
    } catch (e) {
      addEntry(code, ["error: could not reach the server (" + e + ")"], true);
    } finally {
      runBtn.disabled = false;
      status.textContent = "";
      input.focus();
    }
  }

  // --- editing ---
  function replaceSelection(text) {
    const start = input.selectionStart, end = input.selectionEnd;
    input.value = input.value.slice(0, start) + text + input.value.slice(end);
    input.selectionStart = input.selectionEnd = start + text.length;
  }
  function indentSelection(dedent) {
    // Operate on the lines the selection touches.
    const value = input.value;
    let lineStart = value.lastIndexOf("\n", input.selectionStart - 1) + 1;
    const before = value.slice(0, lineStart);
    const block = value.slice(lineStart, input.selectionEnd);
    const after = value.slice(input.selectionEnd);
    const lines = block.split("\n").map(line =>
      dedent ? line.replace(/^ {1,4}/, "") : "    " + line);
    input.value = before + lines.join("\n") + after;
    input.selectionStart = lineStart;
    input.selectionEnd = before.length + lines.join("\n").length;
  }

  // Navigate history only when the caret is at the top/bottom line, so multi-line editing still works.
  function caretOnFirstLine() { return input.value.lastIndexOf("\n", input.selectionStart - 1) === -1; }
  function caretOnLastLine() { return input.value.indexOf("\n", input.selectionEnd) === -1; }
  function recall(index) {
    historyIndex = Math.max(0, Math.min(index, history.length));
    input.value = historyIndex >= history.length ? "" : history[historyIndex];
    refresh();
    input.selectionStart = input.selectionEnd = input.value.length;
  }

  // --- autocomplete ---
  function updateComplete() {
    const before = input.value.slice(0, input.selectionStart);
    let items = [], word = "", dotted = false;
    const dot = before.match(/([A-Za-z_]\w*)\.([A-Za-z_]\w*)?$/);
    if (dot && SYM.members[dot[1]]) {
      dotted = true; word = dot[2] || "";
      const w = word.toLowerCase();
      items = SYM.members[dot[1]].filter(m => m.name.toLowerCase().startsWith(w))
        .map(m => ({ insert: m.name, label: m.sig }));
    } else {
      const bare = before.match(/([A-Za-z_]\w*)$/);
      if (bare) {
        word = bare[1];
        const w = word.toLowerCase();
        items = SYM.globals.filter(g => g.toLowerCase().startsWith(w) && g !== word)
          .map(g => ({ insert: g, label: g }));
      }
    }
    if (items.length === 0 || (!dotted && word === "")) { hideComplete(); return; }
    comp = { items: items.slice(0, 12), sel: 0, wordLen: word.length };
    renderComplete();
  }
  function renderComplete() {
    completeBox.innerHTML = comp.items.map((it, i) =>
      '<div class="opt' + (i === comp.sel ? " sel" : "") + '" data-i="' + i + '">' + esc(it.label) + "</div>").join("");
    completeBox.classList.add("show");
  }
  function hideComplete() { comp.items = []; completeBox.classList.remove("show"); }
  function completeOpen() { return comp.items.length > 0 && completeBox.classList.contains("show"); }
  function moveComplete(delta) {
    comp.sel = (comp.sel + delta + comp.items.length) % comp.items.length;
    renderComplete();
  }
  function acceptComplete() {
    const it = comp.items[comp.sel];
    if (!it) { hideComplete(); return; }
    const start = input.selectionStart - comp.wordLen;
    input.value = input.value.slice(0, start) + it.insert + input.value.slice(input.selectionStart);
    input.selectionStart = input.selectionEnd = start + it.insert.length;
    hideComplete(); refresh();
  }
  completeBox.addEventListener("mousedown", (e) => {
    const opt = e.target.closest(".opt");
    if (opt) { e.preventDefault(); comp.sel = Number(opt.dataset.i); acceptComplete(); input.focus(); }
  });
  input.addEventListener("blur", () => setTimeout(hideComplete, 120));

  input.addEventListener("input", () => { refresh(); updateComplete(); });
  input.addEventListener("scroll", () => { mirror.scrollTop = input.scrollTop; });
  runBtn.addEventListener("click", run);
  document.getElementById("clear").addEventListener("click", () => { log.innerHTML = ""; input.focus(); });

  input.addEventListener("keydown", (e) => {
    // When the completion popup is open it captures navigation / accept / dismiss keys.
    if (completeOpen()) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveComplete(1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); moveComplete(-1); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptComplete(); return; }
      if (e.key === "Escape") { e.preventDefault(); hideComplete(); return; }
    }
    // Enter runs; Shift+Enter inserts a newline (for multi-line blocks); Ctrl/Cmd+Enter also runs.
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault(); run(); return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      if (input.selectionStart !== input.selectionEnd || e.shiftKey) {
        indentSelection(e.shiftKey);
      } else {
        replaceSelection("    ");
      }
      refresh();
      return;
    }
    if (e.key === "ArrowUp" && caretOnFirstLine() && historyIndex > 0) {
      e.preventDefault();
      recall(historyIndex - 1);
    } else if (e.key === "ArrowDown" && caretOnLastLine() && historyIndex < history.length) {
      e.preventDefault();
      recall(historyIndex + 1);
    }
  });

  refresh();
  input.focus();
</script>
</body>
</html>
